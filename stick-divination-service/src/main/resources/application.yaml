server:
  port: 8089

spring:
  datasource:
    url: jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:3306/sticknew?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&SSL=false
    username: root
    password: zhang20061023@
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      lettuce:
        pool:
          enabled: true
          max-active: 10
          max-idle: 10
          min-idle: 0
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.x.xty.app

mybatis:
  configuration:
    map-underscore-to-camel-case: on
  mapper-locations: classpath:mapper/*.xml

pagehelper:
  reasonable: true
  helper-dialect: mysql

dubbo:
  application:
    name: stick-divination-service
  protocol:
    name: dubbo
    port: 20889
  registry:
    address: nacos://${NACOS_HOST:localhost}:8848

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
